name: Build dashboards
on:
  push:
    paths: ['audit.py', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas matplotlib
      - run: python audit.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add before.png after.png superstore_clean.csv
          git commit -m "Generate dashboards and cleaned data" || echo "nothing to commit"
          git push
